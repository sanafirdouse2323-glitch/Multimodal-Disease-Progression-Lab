name: Tests and smoke experiment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m pytest -q
      - run: python scripts/run_experiment.py --patients 120 --epochs 3 --seed 42 --scenario progression_signal --output /tmp/smoke-summary.json
      - run: python scripts/evaluate_progression_scenarios.py --patients 120 --seeds 1 --epochs 1 --bootstrap-replicates 20 --runs-output /tmp/scenario-runs.csv --summary-output /tmp/scenario-summary.csv
